name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Cadence checks
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/cadence-desktop/package-lock.json
            apps/cadence-mobile/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri and ALSA dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libasound2-dev librsvg2-dev
      - name: Test and build desktop frontend
        working-directory: apps/cadence-desktop
        run: |
          npm ci
          npm test
          npm run build
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Check Android TypeScript
        working-directory: apps/cadence-mobile
        run: |
          npm ci --legacy-peer-deps
          npx --no-install tsc --noEmit
